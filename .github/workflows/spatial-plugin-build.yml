name: Spatial Plugin Build

on:
  push:
    branches:
      - "feat/**"
  pull_request:

jobs:
  arch-hyprland:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install system packages
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel \
            cmake \
            git \
            pkgconf \
            hyprland \
            foot \
            jq \
            ttf-dejavu \
            weston

      - uses: actions/checkout@v4

      - name: Report Hyprland build baseline
        run: |
          pkg-config --modversion hyprland
          pacman -Q hyprland

      - name: Configure plugin build
        run: |
          cmake -S spatial/core -B build/spatial-plugin \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSPATIAL_BUILD_PLUGIN=ON \
            -DSPATIAL_BUILD_TESTS=ON

      - name: Build plugin and pure core
        run: cmake --build build/spatial-plugin --parallel 2

      - name: Run pure tests in plugin build
        run: ctest --test-dir build/spatial-plugin --output-on-failure

      - name: Verify shared object
        run: |
          test -f build/spatial-plugin/gendbyte-spatial.so
          file build/spatial-plugin/gendbyte-spatial.so

      - name: Parse nested smoke harness
        run: |
          bash -n spatial/core/tests/nested/phase1-smoke.sh
          bash -n spatial/core/tests/nested/headless-runtime.sh

      - name: Run headless runtime projection test
        run: |
          spatial/core/tests/nested/headless-runtime.sh \
            "$(realpath build/spatial-plugin/gendbyte-spatial.so)"
