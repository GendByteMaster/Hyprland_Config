name: Lua

on:
  push:
    branches:
      - "feat/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Run tests
        run: lua5.1 tests/run.lua
      - name: Parse Lua files
        run: find . -name '*.lua' -type f -print0 | xargs -0 -n1 luac5.1 -p
