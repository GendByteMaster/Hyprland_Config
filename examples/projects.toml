# Hyprland Workstation — personal project workspace template
#
# Copy to:
#   ~/.config/hyprland-workstation/projects.toml
#
# The launcher discovers Git repositories under ~/Repository automatically.
# These overrides add a conservative Open Workspace layout:
#   workspace 1 -> resolved editor
#   workspace 2 -> interactive project shell
#
# No application class/title matching is enabled here because real Hyprland
# classes differ between Code, VSCodium, Zed, Cursor, browsers, and versions.
# Add singleton/match only after checking live `hyprctl clients -j` output.

roots = ["~/Repository"]
max_depth = 4

[apps]
terminal = "auto"

[[overrides."~/Repository/Voxelyra_Nexus".workspace.targets]]
name = "editor"
workspace = 1
operation = "editor"

[[overrides."~/Repository/Voxelyra_Nexus".workspace.targets]]
name = "shell"
workspace = 2
terminal = true
argv = ["bash"]

